<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Privora</title>
  <script>
    // GitHub Pages SPA redirect — encodes full path as /?p=/path
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '~and~' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
