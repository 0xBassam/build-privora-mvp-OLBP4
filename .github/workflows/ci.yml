name: CI — Test, Lint & Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Lint ─────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─── Backend: Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: ci_jwt_secret_not_for_production
      ENCRYPTION_KEY: ci_32_char_encryption_key_here!!
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      OTP_EXPIRES_MINUTES: 10
      OTP_LENGTH: '6'
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─── Backend: Security Audit ─────────────────────────────────────────────────
  backend-security:
    name: Backend — Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev || true

      - name: Secret scanning — check for committed secrets
        run: |
          echo "Scanning for committed secrets..."
          # Check for common secret patterns
          if grep -rE "(password|secret|api_key|private_key)\s*=\s*['\"][^'\"]{8,}" \
            --include="*.js" --include="*.ts" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=coverage \
            src/ 2>/dev/null | grep -v "example\|test\|mock\|placeholder\|your_"; then
            echo "WARNING: Potential hardcoded secrets detected — review above"
            exit 1
          fi
          echo "No hardcoded secrets detected."

  # ─── Frontend: Build ──────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ''
          VITE_DEMO_MODE: 'false'

      - name: Check build output exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed — dist/index.html not found"
            exit 1
          fi
          echo "Build output size:"
          du -sh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─── Frontend: Security Audit ────────────────────────────────────────────
  frontend-security:
    name: Frontend — Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev || true

  # ─── All CI Passed gate ─────────────────────────────────────────────────
  ci-gate:
    name: CI Gate — All checks passed
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, backend-security, frontend-build, frontend-security]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-lint.result }}" != "success" ]]; then
            echo "backend-lint FAILED"; exit 1
          fi
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "backend-test FAILED"; exit 1
          fi
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "frontend-build FAILED"; exit 1
          fi
          echo "All CI checks passed."

      - name: Notify Slack — CI Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":x: *CI FAILED* on `${{ github.ref_name }}` by @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
