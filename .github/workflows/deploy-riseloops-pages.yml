name: Deploy RiseLoops Landing Page to GitHub Pages

on:
  push:
    branches: [claude/riseloops-landing-page-u2mrir]
    paths:
      - 'riseloops-landing/**'
      - '.github/workflows/deploy-riseloops-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-riseloops
  cancel-in-progress: false

jobs:
  build:
    name: Build (Next.js static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riseloops-landing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: riseloops-landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: riseloops-landing/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
