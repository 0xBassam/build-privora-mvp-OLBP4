version: '3.9'

networks:
  privora-net:
    name: privora-net
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: privora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-privora_db}
      POSTGRES_USER: ${DB_USER:-privora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-privora_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - privora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-privora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privora_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-privora}:${DB_PASSWORD:-privora_secret}@db:5432/${DB_NAME:-privora_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-10}
      OTP_LENGTH: ${OTP_LENGTH:-6}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    networks:
      - privora-net
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty so API calls use relative /api/v1 — proxied by nginx to backend container
        VITE_API_URL: ""
        VITE_DEMO_MODE: "false"
    container_name: privora_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - privora-net

volumes:
  postgres_data:
  backend_logs:
